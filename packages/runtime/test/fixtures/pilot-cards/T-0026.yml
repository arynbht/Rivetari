  - import Appendix constants from src/lib/analysis/config.ts
  - config.ts may only gain new FIXED_CONSTANTS keys; existing keys and values
    stay
  - static export only; pure TypeScript with no browser or Node APIs
  - depends on B1-1 (tests use synth.ts)
