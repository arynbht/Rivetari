notes: >
  An interactive map of the codebase (floorplan/index.html, architecture.json, descriptions/),
  drawn at init and updated when a task merges, behind the profile's `floorplan` flag. The Node
  scripts have no dependencies and make no network calls; the model only writes architecture.json,
  descriptions/*.json and recent-work.json. Rivetari runs them in unattended mode, which writes
  nothing outside floorplan/. Never run open.mjs or floorplan/serve.mjs from Rivetari: the server is
  the only code that reaches the network (the Floorplan Cloud waitlist, on a click, and the Ask
  bar's claude or codex). The scripts can't move the map out of floorplan/ at the repo root
  (describe.mjs, refresh.mjs and recent.mjs ignore --out), so it stays there, ignored by its own
  .gitignore and the repo's. Unrelated to the engine's deep-audit "Floor Plan".
