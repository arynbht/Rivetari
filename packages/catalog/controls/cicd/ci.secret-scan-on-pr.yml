id: ci.secret-scan-on-pr
title: CI scans each PR's commits for secrets
lane: cicd
phase: harden
severity: medium
effort: small
detect:
  - type: workflow
    check: secret-scan-on-pr
    exclude: ".github/workflows/rivetari.yml|.github/workflows/rivetari.yaml"
evidence: none
# Adds a `secret-scan` job (full-history checkout and gitleaks) to the PR
# workflow, and to the `ci` aggregator's needs when there is one.
fix:
  type: workflow
  patch: secret-scan-on-pr
references:
  - name: gitleaks — GitHub Action
    url: https://github.com/gitleaks/gitleaks-action
rationale: >
  A secret scan that runs on the pull request reads every commit in it, so a
  key committed and then deleted in a later commit is still caught before it
  reaches the default branch's history.
