id: ci.required-aggregator
title: One required `ci` check aggregates the PR jobs
lane: cicd
phase: build
severity: medium
effort: small
detect:
  - type: workflow
    check: required-aggregator
    exclude: ".github/workflows/rivetari.yml|.github/workflows/rivetari.yaml"
evidence: none
# Passes a `ci` job that needs other jobs, runs with `if: always()` and reads
# their results; a job may be left out of its needs on purpose. The fix adds a
# `ci` job that needs every other PR job and fails when one of them failed
# (skipped counts as passed), or turns an existing `ci` job into that.
fix:
  type: workflow
  patch: required-aggregator
references:
  - name: GitHub Docs — About protected branches (required status checks)
    url: https://docs.github.com/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#require-status-checks-before-merging
  - name: GitHub Docs — Using conditions to control job execution
    url: https://docs.github.com/actions/using-jobs/using-conditions-to-control-job-execution
rationale: >
  Branch protection requires checks by name. One `ci` job that waits for every
  other job and fails when any of them failed is the only check to require, so
  jobs can be added, split or skipped by path without editing the ruleset, and
  a skipped job never leaves a required check pending.
