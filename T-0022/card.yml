id: T-0022
title: Decide keyword-only borderline sectors as not in, without holding the route
type: fix
source: prompt
description: "Bug 9 (redraft of T-0021). At review-at-pr a sector that scores
  only from description keywords (score 1, such as observability from the word
  'metrics') lands in the route's borderline list, and routeConcerns turns any
  borderline sector into a concern that holds the route for a person; it held
  T-0009, T-0011, T-0013, T-0014 and T-0017 on words like CI, perf,
  observability, secret and metrics. The router decides a sector whose whole
  score comes from description keywords as not in: the route records it as
  decided not-in for that reason, the ledger's route line says so, and it
  doesn't hold the route at review-at-pr. A borderline sector that also scores
  from a path, a title keyword, a manifest or skill trigger, or IaC still holds
  the route as it does now. Keyword-only sectors may stay in the borderline list
  for display. One existing test changes, and only its input:
  packages/cli/src/commands/task.test.ts's 'at review-at-pr, stops once at the
  route with the reason when a sector is borderline' builds its borderline
  sector from the keyword 'page', which this fix stops holding; its card changes
  so the borderline sector scores from a non-keyword source (such as a skill's
  path trigger), and its assertions that the route stops once with the reason
  stay as they are. No other existing test changes."
acceptance:
  - id: A1
    text: route() for a card whose only match for observability is 'metrics' in the
      description marks observability as decided not-in because it scored only
      on description keywords
    verify: unit
  - id: A2
    text: at review-at-pr, a route whose only borderline sectors are keyword-only is
      approved without asking, and the ledger says each was decided not-in
    verify: unit
  - id: A3
    text: at review-at-pr, a borderline sector that scores from a manifest or skill
      trigger or IaC still holds the route for a person
    verify: unit
  - id: A4
    text: the only existing test changed is task.test.ts's 'stops once at the route
      with the reason when a sector is borderline', and only its card input; its
      assertions are unchanged
    verify: review
out_of_scope: []
touches:
  - packages/runtime/src/router/route.ts
  - packages/runtime/src/router/task-route.ts
  - packages/runtime/src/task/autonomy.ts
  - packages/runtime/src/task/keyword-borderline.test.ts
  - packages/cli/src/commands/task.test.ts
  - packages/action/dist/**
  - .changeset/keyword-borderline.md
pages: []
constraints: []
