# Secret-scanning backstop over the full history: the pre-commit hook (lefthook +
# gitleaks) can be bypassed with --no-verify. PRs and pushes scan only their own
# commits in ci-next; this goes back to the first commit, weekly.
name: secret-scan

on:
  schedule:
    - cron: "29 5 * * 1" # Mondays 05:29 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: secret-scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
