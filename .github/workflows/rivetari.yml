name: rivetari

# Not on push: a merge to main doesn't change what the weekly run reports.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

# One run per ref. A newer PR update supersedes an in-flight run so the two
# can't race on the sticky comment; scheduled runs queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR runs post a sticky review comment — they need pull-requests:write only.
  audit-pr:
    # Stable check name so the main ruleset can require it ("Rivetari").
    name: rivetari
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Task PRs don't commit the bundle, so build the PR's own before using it.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build the action bundle
        run: pnpm install --frozen-lockfile && pnpm action:build
      - name: Rivetari audit
        uses: ./packages/action
        with:
          gate: build

  # Scheduled / manual runs maintain the pinned status issue — they need
  # issues:write only (and never pull-requests:write).
  audit-status:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # main's committed bundle trails the source between releases.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build the action bundle
        run: pnpm install --frozen-lockfile && pnpm action:build
      - name: Rivetari audit
        uses: ./packages/action
        with:
          gate: build
