# Changesets release. Manually dispatched for now; promote to `push: [main]` once
# "Allow GitHub Actions to create and approve pull requests" is enabled in repo
# settings (Settings → Actions → General).
#
# A dispatch with pending changesets opens or updates the Version Packages PR. A
# dispatch after that PR merges (no changesets left) publishes the packages to
# GitHub Packages (ADR-0010) and tags the CLI's version as `v<version>` with a
# GitHub Release, which is the tag `rivetari init` pins the action to. The
# floating `v1` tag is moved by hand, not here.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

# A double-dispatch must not race two Version Packages PR updates.
# A second dispatch queues behind the first rather than cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    # Publishing from any other branch would release code that never merged.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `pnpm install` runs `lefthook install` (the prepare script), so the automated
    # "version packages" commit trips the repo's pre-commit hook — which runs gitleaks
    # (not on the runner → exit 127) and fails the commit. Those hooks are for human
    # commits, not this bot commit; disable lefthook for the whole job.
    env:
      LEFTHOOK: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Each package's publishConfig names the registry; this is the login for it.
      # The token stays an env reference, so it's never written to disk.
      - name: Log npm in to GitHub Packages
        run: |
          {
            echo "@arynbht:registry=https://npm.pkg.github.com"
            echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}'
          } >> ~/.npmrc
      - name: Create or update the Version Packages PR, or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # version-packages also rebuilds the action bundle: it's rebuilt here,
          # once per release, instead of on every task PR.
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
          # One release per version, for the CLI's v<version> tag below, rather
          # than one per package that would each claim to be the latest.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Runs whenever the publish path ran, not only when something was new, so a
      # dispatch after a failed tag step still tags a version that's published.
      - name: Tag and release the CLI version
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
            exit 0
          fi
          # The CLI changelog's section for this version is the release notes.
          awk -v head="## $version" '$0 == head { on = 1; next } on && /^## / { exit } on' \
            packages/cli/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
